# Table-plane coordinate grid for SomaCube assembly

grid:
  # Origin and coordinate frame
  origin:
    frame_id: "base"                # robot base frame
    position: [0.45, 0.0, 0.15]    # x(forward), y(left), z(up) from base [m]
    orientation: [0.0, 0.0, 0.0]    # rpy [rad], z+ up, x+ forward
    
  # Grid unit cell (one SomaCube unit)
  cell:
    size_m: 0.025                   # 25mm per unit cube
    units_x: 4                      # 4x4 assembly area  
    units_y: 4
    units_z: 2                      # 2-layer height
    
  # Grid vectors (table plane)
  basis:
    ex: [1.0, 0.0, 0.0]            # x-direction (robot forward)
    ey: [0.0, 1.0, 0.0]            # y-direction (robot left)
    ez: [0.0, 0.0, 1.0]            # z-direction (up)
    
  # Assembly workspace bounds
  workspace:
    x_range_m: [-0.05, 0.15]       # relative to grid origin
    y_range_m: [-0.10, 0.10] 
    z_range_m: [0.0, 0.08]         # 2-layer + clearance
    
  # Visual markers for debugging
  visualization:
    publish_grid_markers: true
    marker_topic: "/grid/markers"
    cell_wireframe_color: [0.5, 0.5, 0.5, 0.3]  # rgba
    origin_marker_scale: 0.02