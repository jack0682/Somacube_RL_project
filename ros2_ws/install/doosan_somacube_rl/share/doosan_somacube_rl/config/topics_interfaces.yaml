# Topic name mappings and interface overrides

topics:
  # Input streams
  camera:
    rgb_raw: "/camera/color/image_raw"
    depth_aligned: "/camera/aligned_depth_to_color/image_raw" 
    camera_info: "/camera/color/camera_info"
    
  # YOLO detection
  detections: "/detections"         # yolov8 output
  
  # Robot state  
  joint_states: "/joint_states"
  ee_pose: "/ee/pose"
  ft_wrench: "/ee/ft"              # geometry_msgs/WrenchStamped
  gripper_state: "/gripper/state"
  
  # Emergency/safety
  estop: "/system/estop"           # std_msgs/Bool
  
  # Internal pipeline
  pc_preprocessed: "/pc_preprocess/output"      # sensor_msgs/PointCloud2
  pc_register_pose: "/pc_register/pose"         # geometry_msgs/PoseStamped  
  pc_register_quality: "/pc_register/quality"   # custom RegisterQuality
  pose_filtered: "/pose/filtered"               # geometry_msgs/PoseStamped
  policy_cmd: "/policy/lo/cmd"                  # custom PolicyCmd
  safety_events: "/safety/events"               # custom SafetyEvent
  
  # High-level coordination
  layer1_target: "/layer1/next_target"          # geometry_msgs/PoseStamped
  sequencer_state: "/sequencer/state"           # std_msgs/String
  kpi_metrics: "/kpi/state"                     # std_msgs/String (JSON)
  
  # Debug/visualization
  debug_pc_raw: "/debug/pc_raw"
  debug_pc_filtered: "/debug/pc_filtered" 
  debug_icp_result: "/debug/icp_aligned"
  debug_heightmap: "/debug/heightmap"           # sensor_msgs/Image
  rviz_markers: "/visualization_marker_array"

# Message type mappings (for interface consistency)
interfaces:
  RegisterQuality: "doosan_somacube_rl/RegisterQuality"
  PolicyCmd: "doosan_somacube_rl/PolicyCmd" 
  SafetyEvent: "doosan_somacube_rl/SafetyEvent"
  
# QoS profiles
qos:
  realtime:
    reliability: "reliable"
    durability: "volatile" 
    history: "keep_last"
    depth: 1
    
  sensor_data:
    reliability: "best_effort"
    durability: "volatile"
    history: "keep_last" 
    depth: 5
    
  command:
    reliability: "reliable"
    durability: "volatile"
    history: "keep_last"
    depth: 10