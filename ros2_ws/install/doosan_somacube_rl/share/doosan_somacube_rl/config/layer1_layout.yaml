# Layer 1 SomaCube placement layout and sequencing
# 7-piece cube assembly: unit, pair, triplet, single

layer1:
  grid_ref: "table_plane"           # coordinate reference
  z_offset_m: 0.002                 # above table surface
  
  # Placement order heuristic: larger/stable pieces first
  sequence:
    - piece_id: 1                   # L-piece (3 units)
      type: "triplet"
      target_cell: [0, 0]           # grid coordinates
      preferred_orientation_deg: [0, 90, 180, 270]  # yaw candidates
      stability_priority: "high"
      
    - piece_id: 2                   # I-piece (3 units)  
      type: "triplet"
      target_cell: [1, 0]
      preferred_orientation_deg: [0, 90]
      stability_priority: "high"
      
    - piece_id: 3                   # T-piece (4 units)
      type: "tetrad"
      target_cell: [0, 1] 
      preferred_orientation_deg: [0, 90, 180, 270]
      stability_priority: "medium"
      depends_on: [1]               # wait for piece 1
      
    - piece_id: 4                   # Corner piece (4 units)
      type: "tetrad" 
      target_cell: [1, 1]
      preferred_orientation_deg: [0, 90, 180, 270]
      stability_priority: "medium"
      depends_on: [1, 2]
      
    - piece_id: 5                   # S-piece (4 units)
      type: "tetrad"
      target_cell: [0, 2]
      preferred_orientation_deg: [0, 90, 180, 270] 
      stability_priority: "low"
      depends_on: [3]
      
    - piece_id: 6                   # Z-piece (4 units)
      type: "tetrad"
      target_cell: [1, 2]
      preferred_orientation_deg: [0, 90, 180, 270]
      stability_priority: "low"
      depends_on: [4]
      
    - piece_id: 7                   # Single unit
      type: "unit"
      target_cell: [2, 1]           # fills remaining gap
      preferred_orientation_deg: [0] # orientation-free
      stability_priority: "minimal"
      depends_on: [1, 2, 3, 4, 5, 6]  # last piece

  # Assembly constraints
  constraints:
    max_simultaneous_pieces: 2      # limit parallel assembly
    min_support_contact_ratio: 0.3  # stability check
    collision_margin_m: 0.005       # inter-piece clearance
    
  # Fallback strategies
  fallback:
    alt_orientations_on_failure: true
    swap_sequence_on_deadlock: true
    max_sequence_permutations: 6
    
  # Success criteria
  success:
    all_pieces_placed: true
    total_assembly_time_s: 300      # 5 min target
    max_force_violations: 2         # per piece
    final_stability_check: true