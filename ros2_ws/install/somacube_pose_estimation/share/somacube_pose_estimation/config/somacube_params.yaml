# 소마큐브 6DoF 포즈 추정 시스템 통합 파라미터
# 수학적 정밀 체계의 모든 단계별 파라미터 정의

# 공통 파라미터
common:
  # 토픽 이름
  topics:
    rgb: '/camera/color/image_raw'
    depth: '/camera/aligned_depth_to_color/image_raw'
    camera_info: '/camera/color/camera_info'
    
  # 좌표계
  frames:
    world: 'world'
    base: 'base_link'
    camera: 'camera_link'
    
  # 실시간 처리 주파수
  realtime:
    yolo_detection_hz: 30.0
    preprocess_rate_hz: 15.0
    register_rate_hz: 10.0
    pca_analysis_hz: 5.0
    alignment_rate_hz: 5.0
    fusion_rate_hz: 2.0

# YOLO 검출기 파라미터
yolo_detector:
  # 모델 설정
  model_path: 'models/somacube_best.pt'
  device: 'cpu'  # 'cuda' if available
  input_size: [640, 640]
  
  # 검출 임계값
  confidence_threshold: 0.6
  iou_threshold: 0.4
  max_detections: 15
  
  # 수학적 검증 (정리 T4 관련)
  validation:
    min_area_pixels: 500
    max_area_pixels: 40000
    min_aspect_ratio: 0.3
    max_aspect_ratio: 3.5
    edge_exclusion_margin: 15
    
  processing_rate_hz: 30.0

# 점군 전처리 파라미터 (정리 T1-T6)
pointcloud_processor:
  processing_rate_hz: 15.0
  depth_scale: 0.001  # mm to m
  depth_max_m: 1.5
  depth_min_m: 0.1
  
  # 정리 T4: RANSAC 평면 제거
  plane_removal:
    enable: true
    epsilon: 0.008
    max_iterations: 1500
    min_inliers: 150
    
  # 정리 T5: Voxel 다운샘플링
  voxel_downsample:
    enable: true
    size_m: 0.003
    
  # 정리 T6: DBSCAN 클러스터링
  clustering:
    enable: true
    eps: 0.012
    min_samples: 60
    min_cluster_points: 120
    
  # ROI 필터링
  roi_filtering:
    enable: true
    expansion_ratio: 0.25
    min_depth_m: 0.08
    
  # 글로벌 맵
  global_map:
    enable: true
    voxel_size_m: 0.002
    max_points: 2000000

# PCA 축 추정 파라미터 (정리 T7-T12)
pca_axis_estimator:
  processing_rate_hz: 5.0
  
  # 정리 T7-T8: PCA 분석
  pca:
    min_points: 80
    primary_dominance_threshold: 0.65
    linearity_ratio_threshold: 2.5
    isotropy_threshold: 0.15
    
  # 정리 T10-T11: 면 노멀 추정
  normals:
    enable: true
    knn_k: 25
    clustering_enable: true
    n_clusters: 6
    consistency_threshold: 0.85
    
  # 정리 T9: 안정성 추적
  stability:
    history_length: 8
    convergence_threshold: 0.08
    min_stable_frames: 4
    
  # 수치적 안정성
  numerical:
    eigenvalue_epsilon: 1e-10
    condition_number_max: 1e8
    
  # 디버그
  debug:
    visualize_axes: true
    visualize_normals: false
    axis_length_m: 0.04

# 맨해튼 정렬 파라미터 (정리 T12-T16)
manhattan_aligner:
  processing_rate_hz: 5.0
  
  # 정리 T13: 축 정렬
  alignment:
    method: 'brute_force'  # 'brute_force' or 'optimization'
    score_threshold: 0.6
    max_iterations: 48
    
  # 정리 T14: 직교화
  orthogonalization:
    enable: true
    tolerance: 1e-5
    max_condition_number: 1e10
    
  # 정리 T15-T16: 치수 및 위치
  dimensions:
    enable: true
    noise_tolerance_m: 0.003
    quantization_error_m: 0.002
    
  # 보조정리 L2: 테이블 접촉
  table_contact:
    enable: true
    tolerance_m: 0.008
    table_z: 0.0
    
  # 융합 방법
  fusion:
    enable_pca: true
    enable_normals: true
    pca_weight: 0.7
    normals_weight: 0.3
    
  # 품질 검증
  validation:
    min_inlier_ratio: 0.55
    max_residual_m: 0.015
    min_coverage_ratio: 0.75
    
  # 디버그
  debug:
    visualize_poses: true
    visualize_obb: true
    pose_scale: 0.04

# 멀티뷰 융합 파라미터 (정리 T17-T19, T24-T27)
multiview_fusion:
  processing_rate_hz: 2.0
  
  # 정의 D10: 유사도 메트릭
  similarity:
    position_weight: 0.35
    rotation_weight: 0.35
    size_weight: 0.25
    confidence_weight: 0.05
    position_sigma_m: 0.025
    rotation_sigma_rad: 0.20  # ~11.5도
    size_sigma_m: 0.015
    
  # 정리 T21: 헝가리안 할당
  assignment:
    similarity_threshold: 0.4
    max_distance_m: 0.08
    max_rotation_deg: 25.0
    
  # 정리 T17: 회전 평균
  rotation_averaging:
    method: 'svd'
    max_iterations: 40
    tolerance: 1e-5
    
  # 정리 T18: 위치 융합
  position_fusion:
    method: 'huber'  # 'mean', 'huber', 'ransac'
    huber_delta: 0.015
    ransac_threshold: 0.025
    min_consensus: 0.55
    
  # 정리 T25: 수렴성
  convergence:
    min_views: 3
    max_position_change_m: 0.008
    max_rotation_change_deg: 3.0
    stability_window: 4
    
  # 전역 최적화
  global_optimization:
    enable: true
    bundle_adjustment: false
    max_iterations: 80
    
  # 품질 보증
  quality_assurance:
    min_view_agreement: 0.6
    outlier_detection: true
    cross_validation: true

# 카메라 포즈 매니저
camera_pose_manager:
  pose_file: 'config/camera_poses.yaml'
  auto_tf_broadcast: true
  global_map_frame: 'world'

# 시각화 설정
visualization:
  enable_markers: true
  enable_point_clouds: true
  enable_poses: true
  marker_lifetime_sec: 3.0
  
# 로깅 레벨
logging:
  level: 'INFO'  # DEBUG, INFO, WARN, ERROR
  
# 성능 모니터링
performance:
  enable_timing_analysis: true
  enable_memory_monitoring: false
  log_statistics_interval_sec: 30.0

# 실험적 기능
experimental:
  enable_advanced_filtering: false
  enable_learning_based_refinement: false
  enable_temporal_consistency: false